<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="stratumBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <linearGradient id="layerTopGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E0E7FF" />
    </linearGradient>
    <linearGradient id="layerMidGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C7D2FE" />
      <stop offset="100%" stop-color="#A5B4FC" />
    </linearGradient>
    <linearGradient id="layerBotGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="0.8" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Squircle Base with Stratum Gradient -->
  <rect width="32" height="32" rx="7.5" fill="url(#stratumBg)" />

  <!-- Crisp Inner Border for Dark/Light tab contrast -->
  <rect x="0.75" y="0.75" width="30.5" height="30.5" rx="6.75" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="0.75" fill="none" />

  <!-- Layered Isometric Strata Icon -->
  <g filter="url(#shadow)">
    <!-- Top Floating Diamond / Stratum Sheet -->
    <path d="M16 6 L24 10.5 L16 15 L8 10.5 Z" fill="url(#layerTopGrad)" />
    
    <!-- Middle Layer -->
    <path d="M8 13.5 L16 18 L24 13.5 L24 15.2 L16 19.7 L8 15.2 Z" fill="url(#layerMidGrad)" />
    
    <!-- Bottom Layer -->
    <path d="M8 18.2 L16 22.7 L24 18.2 L24 20 L16 24.5 L8 20 Z" fill="url(#layerBotGrad)" />
  </g>
</svg>
